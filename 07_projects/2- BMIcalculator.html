<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="2-style.css">
</head>
<body>
    <h1>BMI Calculator</h1>
    <form action="">
        
        <p><label for="weight">Weight in kgs:</label>
        <input type="number" name="weight" id="weight"></p>
        <p><label for="height">Height in cm:</label>
        <input type="number" name="height" id="height"></p>
        <button>Calculate</button>
        <div id="result"></div>
    </form>

    <h2>BMI weight guide</h2>
    <p>Under Weight = Less than 18.6</p>
    <p>Normal Range = 18.6 to 24.9</p>
    <p>Over Weight = More than 24.9</p>
</body>
<script src="2-script.js"></script>
</html>
